<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Judo-Lerntrainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine Spalte fürs Handy, feste Tab-Leiste unten, jede Frage ein eigener Bildschirm */
:root{
  --bg:#edf0f5; --surface:#ffffff; --fg:#17203a; --muted:#566080; --line:#d5dae8;
  --ink:#233a7c; --ink-fg:#ffffff; --soft:#e2e8f7;
  --good:#256b48; --good-bg:#dff1e7; --bad:#a8322a; --bad-bg:#f8e1de;
  --font-d:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --font-b:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1323; --surface:#16203a; --fg:#e8ecf7; --muted:#9aa6c8; --line:#29345a;
    --ink:#93acff; --ink-fg:#0d1323; --soft:#202c4f;
    --good:#74d3a0; --good-bg:#15352a; --bad:#ff8f84; --bad-bg:#3b1d1f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1323; --surface:#16203a; --fg:#e8ecf7; --muted:#9aa6c8; --line:#29345a;
  --ink:#93acff; --ink-fg:#0d1323; --soft:#202c4f;
  --good:#74d3a0; --good-bg:#15352a; --bad:#ff8f84; --bad-bg:#3b1d1f; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-b); font-size:16px; line-height:1.45;
  margin:0; padding-block:14px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-d);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.55rem;line-height:1.1}
h2{font-size:1.3rem;line-height:1.2}
h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mut{color:var(--muted)}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.head{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.belt{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.belt i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .4s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;min-height:42px;font-weight:600;font-size:.93rem}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.chip.static{min-height:0;padding:5px 11px;font-weight:500;font-size:.88rem;background:var(--soft);border-color:transparent}
.chip.static.g{background:var(--ink);color:var(--ink-fg);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;min-height:50px;font-weight:700;text-align:center}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.full{width:100%}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:64px}
.mode b{font-family:var(--font-d);font-size:1.05rem;display:block}
.mode span{font-size:.88rem;color:var(--muted)}
.mode .arr{font-size:1.4rem;color:var(--ink);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:700;min-height:44px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18)}
details.grp{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.grp summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary b{font-family:var(--font-d)}
details.grp summary::after{content:"+";font-size:1.3rem;color:var(--ink);flex:none}
details.grp[open] summary::after{content:"–"}
details.grp .in{padding:0 14px 14px;display:flex;flex-wrap:wrap;gap:7px}
.cnt{font-size:.84rem;color:var(--muted);white-space:nowrap}
.q{gap:14px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .belt{flex:1}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;min-height:44px;font-size:1.1rem}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:13px 14px;min-height:54px;font-weight:600;display:flex;gap:10px;align-items:center}
.opt .tick{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:none}
.opts.multi .opt .tick{display:block}
.opt.on{border-color:var(--ink);background:var(--soft)}
.opt.on .tick{background:var(--ink);border-color:var(--ink)}
.opt.good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt.miss{border-style:dashed;border-color:var(--good);color:var(--good)}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb p{color:var(--fg);font-size:.95rem}
.tin{display:flex;gap:8px}
.tin input{flex:1;min-width:0;font:inherit;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);min-height:52px}
.sg{display:flex;flex-wrap:wrap;gap:8px;min-height:6px}
.found{display:flex;flex-wrap:wrap;gap:7px}
.pill{border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.miss{border:1px dashed var(--good);color:var(--good)}
.fc{min-height:230px;justify-content:center;text-align:center;align-items:center}
.fc .name{font-family:var(--font-d);font-size:1.7rem;line-height:1.15}
.fc .items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink)}
.prow{display:flex;align-items:center;gap:10px}
.prow .n{flex:0 0 46%;min-width:0;font-weight:600;font-size:.93rem}
.prow .c{flex:none;font-size:.82rem;color:var(--muted);min-width:44px;text-align:right}
.tog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.tog .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line)}
.tog.on .box{background:var(--ink);border-color:var(--ink)}
.tog small{display:block;color:var(--muted);font-size:.8rem}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:transparent;padding:12px 4px 11px;min-height:56px;font-weight:600;font-size:.78rem;color:var(--muted);position:relative}
.nav button.on{color:var(--ink)}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:30;max-width:90vw}
.res{display:flex;flex-direction:column;gap:8px}
.hit{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:56px;display:flex;flex-direction:column;gap:1px}
.hit b{font-family:var(--font-d)}
.hit span{font-size:.84rem;color:var(--muted)}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.kv{display:flex;flex-direction:column;gap:2px}
.kv small{color:var(--muted);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{min-width:0}
.logo{height:44px;width:auto;max-width:72px;object-fit:contain;border-radius:8px;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.big{font-family:var(--font-d);font-size:2.6rem;line-height:1}
@media (prefers-reduced-motion:reduce){.belt i{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>

<nav class="nav" id="nav"><div class="in">

</div></nav>

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};

function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'')
    .replace(/barai|barei|harei/g,'harai').replace(/seio/g,'seoi').replace(/shio/g,'shiho')
    .replace(/kuruma/g,'guruma').replace(/shime/g,'jime').replace(/kasehi/g,'kataha');
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));}p=c;}
  return p[n];
}
function resolve(text,pool){
  const n=norm(text); if(n.length<3)return null;
  for(const it of pool){ if(norm(it.name)===n||it.alias.some(a=>norm(a)===n))return it; }
  const lim=n.length>=12?2:(n.length>=6?1:0); if(!lim)return null;
  let best=null,bd=99,tie=false;
  for(const it of pool){
    const d=Math.min(lev(n,norm(it.name)),...it.alias.map(a=>lev(n,norm(a))));
    if(d<bd){bd=d;best=it;tie=false;}else if(d===bd&&it!==best){tie=true;}
  }
  return (bd<=lim&&!tie)?best:null;
}

    return {key,kind:'single',mode,prompt:th.cls(it.name),sub:th.label,options:shuffle(og).map(x=>({id:x.id,label:x.n})),
      correct:[g.id],itemIds:[it.id],explain:`${it.name} gehört zu ${g.n}.`};
  }
  const g=gs.find(x=>x.id===id); if(!g)return null;
  if(mode==='multi'){
    const out=outside(th,g); if(g.items.length<2||out.length<3)return null;
    const k=Math.min(g.items.length,4+rnd(2)); const d=Math.min(out.length,Math.max(3,8-k));
    const right=pick(g.items,k), wrong=pick(out,d);
    return {key,kind:'multi',mode,prompt:`Welche Techniken gehören zu ${g.n}?`,sub:th.label+' · Mehrfachauswahl',
      options:shuffle(right.concat(wrong)).map(x=>({id:x.id,label:x.name})),correct:right.map(x=>x.id),itemIds:right.concat(wrong).map(x=>x.id),
      explain:`Zu ${g.n} gehören: ${right.map(x=>x.name).join(', ')}.`};
  }
  if(mode==='type'){
    return {key,kind:'type',mode,prompt:`Nenne die Techniken der Gruppe ${g.n}`,sub:th.label,group:g,dom:th.dom,
      itemIds:g.items.map(x=>x.id),total:g.items.length};
  }
  if(mode==='grund'){
    if(g.items.length<2)return null;
    const gr=g.items.find(x=>x.grund)||g.items[0];
    const oth=g.items.filter(x=>x!==gr); let ds=pick(oth,3);
    if(ds.length<3)ds=ds.concat(pick(outside(th,g),3-ds.length));
    return {key,kind:'single',mode,prompt:`Welche Technik ist die Grundform der Gruppe ${g.n}?`,sub:th.label,
      options:shuffle([gr].concat(ds)).map(x=>({id:x.id,label:x.name})),correct:[gr.id],itemIds:[gr.id],
      explain:`Grundform von ${g.n} ist ${gr.name}.`};
  }
  if(mode==='odd'){
    const out=outside(th,g); if(g.items.length<3||!out.length)return null;
    const od=pick(out,1)[0], mem=pick(g.items,3);
    return {key,kind:'single',mode,prompt:`Welche Technik gehört nicht zur Gruppe ${g.n}?`,sub:th.label,
      options:shuffle(mem.concat([od])).map(x=>({id:x.id,label:x.name})),correct:[od.id],itemIds:[od.id],
      explain:`${od.name} gehört nicht zu ${g.n}. Dazu gehören: ${g.items.map(x=>x.name).join(', ')}.`};
  }
  return null;
}
function pickKeys(all,count){
  const w=k=>(S.q[k]&&S.q[k].s>=3)?1:0;
  return shuffle(all).sort((a,b)=>w(a)-w(b)).slice(0,count);
}

function searchHits(q){
  const n=norm(String(q).replace(/ß/g,'ss')); if(n.length<2)return[];
  const sc=r=>{let b=9;r.nk.forEach(k=>{if(k===n)b=Math.min(b,0);else if(k.startsWith(n))b=Math.min(b,1);else if(k.includes(n))b=Math.min(b,2);});return b;};
  let hits=SEARCH.map(r=>({r,s:sc(r)})).filter(o=>o.s<9);
  if(!hits.length&&n.length>=5){
    hits=SEARCH.map(r=>({r,s:3+Math.min(...r.nk.map(k=>Math.min(lev(n,k),lev(n,k.slice(0,n.length)))))})).filter(o=>o.s<=5);
  }
  hits.sort((a,b)=>a.s-b.s||a.r.name.length-b.r.name.length);
  return hits.slice(0,10).map(o=>o.r);
}

    h+=`<div class="eyebrow">${E[e.kids[0]]?'Enthält':'Techniken ('+e.kids.length+')'}</div><div class="wrap">${kids.join('')}</div>`;
    return h+'</div>';
  }
  const de=DE[it.name]||'';
  let crumbs,lines=[];
  if(it.dom==='n'){
    crumbs=['e:nage','e:wg_'+it.wg].concat(it.gk?['e:gk'+it.gk]:[]).concat(it.hab?['e:h'+it.hab]:[]);
    lines.push(it.gk?`Gokyo: ${GKN[it.gk-1]} (${it.gk}. Gruppe)`:'Außerhalb der Gokyo');
  } else {
    const g=KG.find(x=>x.id===it.g);
    crumbs=['e:katame','e:o_'+it.o,'e:kg_'+it.g];
    const n=g.m.length;
    lines.push(it.grund?(n>1?`Grundform der Gruppe ${g.n}`:`Einzeltechnik (Gruppe ${g.n})`):`Variante in der Gruppe ${g.n}`);
  }
  h+=`<div class="eyebrow">${it.dom==='n'?'Wurf':'Bodentechnik'}</div><h2>${esc(it.name)}</h2>`;
  if(de)h+=`<div class="kv"><small>Deutsch</small><span>${esc(de)}</span></div>`;
  else h+=`<p class="mut">Deutsche Bezeichnung: keine belegte Angabe vorhanden.</p>`;
  h+=`<div class="kv"><small>Einordnung</small><span>${lines.map(esc).join('<br>')}</span></div><div class="wrap">${crumbs.map(c=>chipB(c,E[c].name)).join('')}</div>`;
  const bs=bausteine(it.name);
  if(bs.length)h+=`<div class="kv"><small>Wortbausteine (sinngemäß)</small><span>${esc(bs.join(' · '))}</span></div>`;
  if(it.dom==='k'){
    const sib=K.filter(x=>x.g===it.g&&x!==it);
    if(sib.length)h+=`<div class="kv"><small>Weitere Techniken der Gruppe</small></div><div class="wrap">${sib.map(x=>chipB(x.id,x.name)).join('')}</div>`;
  }
  h+=`</div>`;
  const q='KODOKAN IJF ACADEMY '+it.name;
  const own=(S.vl&&S.vl[it.id])||'';
  const v=VID[it.name];
  h+=`<div class="card"><h3>Video</h3>`;
  if(v){
    h+=`<p class="mut">Video des Kodokan aus der Reihe „KODOKAN × IJF ACADEMY 100 Techniques“: ${esc(v[1])}</p>
    <a class="btn primary full" href="https://www.youtube.com/watch?v=${v[0]}" target="_blank" rel="noopener noreferrer">Kodokan-Video ansehen</a>`;
  } else {
    h+=`<p class="mut">Für diese Technik habe ich kein eigenes Video in der Kodokan-Reihe gefunden. Die Suche öffnet YouTube mit dem Namen der Technik.</p>
    <a class="btn full" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener noreferrer">Technik auf YouTube suchen</a>`;
  }
  h+=`<a class="btn full" href="${YT_PL}" target="_blank" rel="noopener noreferrer">Playlist öffnen</a>`;
  if(own)h+=`<a class="btn full" href="${esc(own)}" target="_blank" rel="noopener noreferrer">Gespeichertes Video öffnen</a>`;
  h+=`<div class="tin"><input id="vl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Eigenen Video-Link einfügen (https://…)" aria-label="Eigener Video-Link" value="${esc(own)}"><button class="btn" data-a="vl-save" data-v="${it.id}">Sichern</button></div></div>`;
  return h;
}

/* ---- Fortschritt ---- */
function viewProg(){
  const o=overall(); const p=o.t?Math.round(o.s/o.t*100):0;
  let h=`<div class="card"><div class="eyebrow">Gesamt</div><div class="big">${p}%</div><p class="mut">${o.s} von ${o.t} Techniken sicher. Sicher heißt: zweimal in Folge richtig beantwortet.</p></div>`;
  THEMES.filter(themeOk).filter(t=>t.id!=='boden').forEach(t=>{
    const gs=t.groups().filter(g=>g.items.length);
    h+=`<div class="card"><h3>${esc(t.label)}</h3>${gs.map(g=>{
      const m=g.items.filter(x=>sure(x.id)).length,pc=Math.round(m/g.items.length*100);
      return `<div class="prow"><span class="n">${esc(g.n)}</span><div class="bar"><i style="width:${pc}%"></i></div><span class="c">${m}/${g.items.length}</span></div>`;
    }).join('')}</div>`;
  });
  h+=V.resetArm?`<div class="card"><p>Alle gespeicherten Ergebnisse löschen? Das lässt sich nicht rückgängig machen.</p><div class="two"><button class="btn" data-a="reset-no">Abbrechen</button><button class="btn danger" data-a="reset-yes">Ja, löschen</button></div></div>`
    :`<button class="btn full" data-a="reset-arm">Fortschritt zurücksetzen</button>`;
  return h;
}

/* ---- Stoff ---- */
function viewStoff(){
  const ex=N.filter(x=>x.extra);
  let h=`<div class="card"><h3>Würfe außerhalb der Gokyo</h3><p class="mut">Die 40 Würfe der Gokyo sind immer dabei. Hier wählst du, welche weiteren Würfe in Lernkarten und Quiz vorkommen.</p>
  <div class="two"><button class="btn" data-a="stoff-all">Alle wählen</button><button class="btn" data-a="stoff-none">Keine wählen</button></div></div>`;
  Object.keys(WGN).forEach(k=>{
    const l=ex.filter(x=>x.wg===k); if(!l.length)return;
    h+=`<div class="modes"><div class="eyebrow">${WGN[k]}</div>${l.map(x=>{
      const on=!S.off.includes(x.id);
      return `<button class="tog${on?' on':''}" data-a="stoff-t" data-v="${x.id}" role="switch" aria-checked="${on}"><span class="box"></span><span>${esc(x.name)}<small>${esc(x.tag)}</small></span></button>`;
    }).join('')}</div>`;
  });
  const ac=activeCombos().length;
  h+=`<div class="modes"><div class="eyebrow">Kombinationen, Finten, Konter</div>
  <button class="tog${S.combo?' on':''}" data-a="stoff-c" role="switch" aria-checked="${S.combo}"><span class="box"></span><span>In Quiz einbeziehen<small>${ac} von ${COMBOS.length} Einträgen aktiv. Ein Eintrag zählt nur, wenn alle beteiligten Würfe gewählt sind.</small></span></button></div>`;
  h+=`<div class="card"><h3>Vereinslogo</h3><p class="mut">Dein Logo erscheint oben neben dem Titel und wird nur auf diesem Gerät gespeichert. Auf einer eigenen Webseite kannst du stattdessen eine Datei logo.png neben die index.html legen.</p>
  <label class="btn full" for="logoin">Logo auswählen</label><input class="vh" id="logoin" type="file" accept="image/*">${S.logo?'<button class="btn full" data-a="logo-del">Logo entfernen</button>':''}</div>`;
  return h;
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  const s=V.quiz.sess;
  switch(a){
    case 'tab': V.tab=v; V.lern.deck=null; V.quiz.setup=null; V.quiz.res=null; V.resetArm=false; render(); window.scrollTo(0,0); break;
    case 'lthemes': V.lern.theme=v; render(); break;
    case 'deck': {
      const th=TH(v); const gs=th.groups().filter(g=>g.items.length);
      const order=shuffle(gs).sort((x,y)=>((S.c['c|'+th.id+'|'+x.id]||{s:0}).s)-((S.c['c|'+th.id+'|'+y.id]||{s:0}).s)).map(g=>g.id);
      V.lern.deck={th:th.id,order,i:0,flip:false,ok:0}; render(); window.scrollTo(0,0); break; }
    case 'deck-exit': V.lern.deck=null; render(); break;
    case 'deck-flip': V.lern.deck.flip=true; render(); break;
    case 'deck-know': case 'deck-again': {
      const d=V.lern.deck,k='c|'+d.th+'|'+d.order[d.i]; const o=S.c[k]||{s:0};
      if(a==='deck-know'){o.s++;d.ok++;}else o.s=0; S.c[k]=o; save(); d.i++; d.flip=false; render(); break; }
    case 'qdom': V.quiz.dom=v; render(); break;
    case 'mode': {
      const ths=THEMES.filter(t=>t.dom===V.quiz.dom&&cands(v,t).length);
      V.quiz.setup={mode:v,dom:V.quiz.dom,themes:[ths[0].id],excl:[],count:v==='type'?3:10}; render(); window.scrollTo(0,0); break; }
    case 'setup-back': V.quiz.setup=null; render(); break;
    case 'setup-theme': {
      const su=V.quiz.setup,i=su.themes.indexOf(v); if(i>=0){if(su.themes.length>1)su.themes.splice(i,1);}else su.themes.push(v); render(); break; }
    case 'setup-group': {
      const su=V.quiz.setup,i=su.excl.indexOf(v);
      if(i>=0)su.excl.splice(i,1); else su.excl.push(v);
      if(!setupKeys().length){ if(i>=0)su.excl.push(v); else su.excl.splice(su.excl.indexOf(v),1); toast('Mindestens eine Gruppe nötig'); }
      render(); break; }
    case 'setup-count': V.quiz.setup.count=+v; render(); break;
    case 'setup-start': {
      const su=V.quiz.setup; const keys=pickKeys(setupKeys(),su.count);
      V.quiz.setup=null; startSession(keys,MODES.find(m=>m.id===su.mode).n,keys); break; }
    case 'mix': {
      const lists=['cls','multi','grund','odd','combo'].map(m=>shuffle(m==='combo'?cands('combo',null):THEMES.filter(t=>t.id!=='boden').flatMap(t=>cands(m,t))));
      const keys=[]; while(keys.length<20&&lists.some(l=>l.length)){lists.forEach(l=>{if(l.length&&keys.length<20)keys.push(l.pop());});}
      startSession(shuffle(keys),'Gemischt',keys); break; }
    case 'fix': { const keys=fixKeys(); startSession(shuffle(keys),'Fehlertraining',keys); break; }
    case 'opt': {
      const q=s.q,st=s.st; if(st.locked)break;
      if(q.kind==='single')answer([v]);
      else{const i=st.chosen.indexOf(v); if(i>=0)st.chosen.splice(i,1); else st.chosen.push(v); render();}
      break; }
    case 'multi-check': answer(s.st.chosen.slice()); break;
    case 'sess-next': nextQ(false); break;
    case 'sess-quit': V.quiz.sess=null; V.quiz.res=null; save(); render(); break;
    case 'type-add': typeAdd(); break;
    case 'type-done': typeFinish(); break;
    case 'sg': typeCommit(byId(v)); break;
    case 'res-home': V.quiz.res=null; render(); break;
    case 'res-again': { const r=V.quiz.res; V.quiz.res=null; startSession(shuffle(r.again),r.label,r.again); break; }
    case 'reset-arm': V.resetArm=true; render(); break;
    case 'reset-no': V.resetArm=false; render(); break;
    case 'reset-yes': S.q={};S.i={};S.c={};V.resetArm=false; save(); render(); toast('Fortschritt gelöscht'); break;
    case 'stoff-t': { const i=S.off.indexOf(v); if(i>=0)S.off.splice(i,1); else S.off.push(v); save(); render(); break; }
    case 'stoff-all': S.off=[]; save(); render(); break;
    case 'stoff-none': S.off=N.filter(x=>x.extra).map(x=>x.id); save(); render(); break;
    case 'lookup': V.such.sel=v; suchUpdate(); window.scrollTo(0,0); break;
    case 'such-back': V.such.sel=null; suchUpdate(); break;
    case 'vl-save': {
      const el=$('#vl'); const val=(el&&el.value||'').trim();
      if(!S.vl)S.vl={};
      if(!val){delete S.vl[v];save();suchUpdate();toast('Link entfernt');break;}
      if(!/^https:\/\/[^\s"<>]+$/.test(val)){toast('Bitte einen vollständigen https-Link einfügen');break;}
      S.vl[v]=val; save(); suchUpdate(); toast('Link gespeichert'); break; }
    case 'logo-del': delete S.logo; save(); render(); break;
    case 'stoff-c': S.combo=!S.combo; save(); render(); break;
  }
});
document.addEventListener('change',e=>{
  if(!e.target||e.target.id!=='logoin')return;
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,240/Math.max(im.width,im.height,1));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
      try{c.getContext('2d').drawImage(im,0,0,c.width,c.height); S.logo=c.toDataURL('image/png');}catch(_){toast('Bild konnte nicht verarbeitet werden');return;}
      save(); render(); toast('Logo gespeichert');
    };
    im.onerror=()=>toast('Bild konnte nicht gelesen werden');
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
});
document.addEventListener('input',e=>{if(e.target.id==='ti')typeSuggest();if(e.target.id==='si'){V.such.q=e.target.value;V.such.sel=null;suchUpdate();}});
document.addEventListener('keydown',e=>{if(e.target.id==='ti'&&e.key==='Enter'){e.preventDefault();typeAdd();}});

render();
try{const pl=new Image();pl.onload=()=>{fileLogo=true;if(!V.quiz.sess)render();};pl.src='logo.png';}catch(e){}
initRemote();
})();
</script>
